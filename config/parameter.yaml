# ---------------------------------------------------------------------------
# Lift Planner · zentrale Parameter
#
# Jede Rechnung der App liest ihre Werte ausschließlich aus dieser Datei
# (bzw. aus den in der App geänderten Werten). Neue Variable = neuer Eintrag.
#
# Felder je Parameter:
#   key        eindeutiger Name, wird im Code verwendet
#   label      Anzeigename
#   einheit    Einheit für Anzeige und Rechenweg
#   wert       Basiswert
#   min/max    zulässiger Bereich (Eingaben werden darauf begrenzt)
#   step       Schrittweite im Eingabefeld
#   typ        float (Standard), int oder bool
#   status     Annahme | Literaturwert | Herstellerangabe | Regelwerk | Validiert
#   quelle     Herkunft des Wertes
#   kommentar  optionale Erläuterung
# ---------------------------------------------------------------------------

gruppen:

  - id: drohne
    titel: Drohne
    beschreibung: Leistungsdaten der Lastendrohne. Nicht an ein Modell gebunden.
    parameter:
      - key: drohne.nutzlast_kg
        label: Maximale Nutzlast je Flug
        einheit: kg
        wert: 80
        min: 5
        max: 500
        step: 5
        status: Annahme
        quelle: In Anlehnung an DJI FlyCart 100, Herstellerdaten prüfen
      - key: drohne.v_reise_ms
        label: Reisegeschwindigkeit
        einheit: m/s
        wert: 10
        min: 1
        max: 30
        step: 0.5
        status: Annahme
        quelle: Planungswert mit Außenlast
      - key: drohne.steigrate_ms
        label: Steigrate
        einheit: m/s
        wert: 3
        min: 0.5
        max: 10
        step: 0.5
        status: Annahme
        quelle: Planungswert mit Außenlast
      - key: drohne.sinkrate_ms
        label: Sinkrate
        einheit: m/s
        wert: 3
        min: 0.5
        max: 10
        step: 0.5
        status: Annahme
        quelle: Planungswert mit Außenlast

  - id: flugbetrieb
    titel: Flugbetrieb
    beschreibung: Zeiten am Boden und Regeln für die Flugeinteilung.
    parameter:
      - key: flug.handling_min
        label: Be- und Entladen je Flug
        einheit: min
        wert: 6
        min: 0
        max: 60
        step: 1
        status: Annahme
        quelle: Schätzung Team
        kommentar: Anhängen, Lösen, Sichtprüfung an Start und Ziel zusammen
      - key: flug.gefahrgut_separat
        label: Gefahrgut in eigenen Flügen
        einheit: ja/nein
        typ: bool
        wert: true
        status: Annahme
        quelle: Konservative Annahme bis zur Klärung mit der Behörde
        kommentar: Akkus und Kraftstoff nicht mit anderer Fracht kombinieren

  - id: profil
    titel: Flugprofil
    beschreibung: Raster der Höhenabfrage und zulässiger Höhenkorridor über Grund.
    parameter:
      - key: profil.raster_m
        label: Rasterabstand Höhenabfrage
        einheit: m
        wert: 30
        typ: int
        min: 10
        max: 500
        step: 10
        status: Annahme
        quelle: Passend zur Auflösung EU-DEM (25 m)
      - key: profil.min_agl_m
        label: Mindestabstand über Grund
        einheit: m
        wert: 30
        min: 5
        max: 150
        step: 5
        status: Annahme
        quelle: Sicherheitsabstand zu Bäumen und Hindernissen, mit Pilot abstimmen
      - key: profil.max_agl_m
        label: Maximale Höhe über Grund
        einheit: m
        wert: 120
        min: 20
        max: 300
        step: 10
        status: Regelwerk
        quelle: VO (EU) 2019/947, Grenze der Open-Kategorie
        kommentar: In der Specific-Kategorie gilt die Betriebsgenehmigung

  - id: boxen
    titel: Transportboxen
    beschreibung: Leergewichte und Zuladung der STIHL-Transportbox und der Alternativen.
    parameter:
      - key: box.leergewicht_kg
        label: Box Leergewicht
        einheit: kg
        wert: 4
        min: 0
        max: 30
        step: 0.5
        status: Annahme
        quelle: Konzept Transportbox, noch kein Prototyp
      - key: box.zuladung_kg
        label: Maximale Zuladung je Box
        einheit: kg
        wert: 35
        min: 5
        max: 200
        step: 1
        status: Annahme
        quelle: Konzept Transportbox
      - key: box.gg_leergewicht_kg
        label: Gefahrgut-Box Leergewicht
        einheit: kg
        wert: 6
        min: 0
        max: 30
        step: 0.5
        status: Annahme
        quelle: Konzept crashsichere Akku-Box
      - key: box.netz_leergewicht_kg
        label: Lastnetz Leergewicht
        einheit: kg
        wert: 2
        min: 0
        max: 20
        step: 0.5
        status: Annahme
        quelle: Für Teile, die nicht in eine Box passen

  - id: geraete
    titel: Geräte und Material
    beschreibung: Transportgewichte je Stück. Die Stückzahl wird im Schritt Equipment gewählt.
    parameter:
      - key: geraet.ms
        label: Motorsäge
        einheit: kg
        wert: 6.5
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Typische Profisäge, Tank leer
        kommentar: Tank leer
      - key: geraet.fs
        label: Freischneider
        einheit: kg
        wert: 9
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Inkl. Schutz und Gurt
        kommentar: inkl. Schutz
      - key: geraet.eb
        label: Erdbohrer
        einheit: kg
        wert: 10
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Inkl. Bohrer
        kommentar: mit Bohrer
      - key: geraet.ht
        label: Hochentaster
        einheit: kg
        wert: 7
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Teleskopausführung
        kommentar: Teleskop
      - key: geraet.sw
        label: Seilwinde
        einheit: kg
        wert: 16
        min: 0
        max: 80
        step: 0.1
        status: Annahme
        quelle: Tragbare Spillwinde
        kommentar: tragbar
      - key: geraet.zb
        label: Zubehör
        einheit: kg
        wert: 9
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Ketten, Keile, Feilen
        kommentar: Ketten, Keile, Feilen
      - key: geraet.wz
        label: Werkzeugkiste
        einheit: kg
        wert: 12
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Servicewerkzeug
        kommentar: Service
      - key: geraet.wv
        label: Verpflegung
        einheit: kg
        wert: 6
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Wasser und Proviant für ein Team
        kommentar: Wasser, Proviant
      - key: geraet.lb
        label: Laubbläser
        einheit: kg
        wert: 11
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Rückentragbares Blasgerät
        kommentar: Rückengerät, für Heuernte

  - id: energie
    titel: Akkus und Betriebsstoffe
    beschreibung: Gewichte der mitgeführten Energieträger (Fracht, nicht Antrieb der Drohne).
    parameter:
      - key: akku.gewicht_kg
        label: Gewicht je Geräte-Akku
        einheit: kg
        wert: 1.6
        min: 0.1
        max: 10
        step: 0.1
        status: Annahme
        quelle: An verwendeten STIHL-Akkutyp anpassen
      - key: kraftstoff.dichte_kg_l
        label: Dichte Kraftstoff
        einheit: kg/l
        wert: 0.75
        min: 0.6
        max: 0.9
        step: 0.01
        status: Literaturwert
        quelle: Ottokraftstoff nach EN 228, ca. 0,72 bis 0,775 kg/l
      - key: kanister.leergewicht_kg
        label: Kanister Leergewicht
        einheit: kg
        wert: 1.0
        min: 0
        max: 5
        step: 0.1
        status: Annahme
        quelle: Kombikanister, leer

  - id: modell
    titel: Betriebsmodell
    beschreibung: Wer die Drohne betreibt und wie abgerechnet wird. Steuert, welche Kostengruppen gelten.
    parameter:
      - key: modell.dienstleister
        label: Abrechnung über Dienstleister
        einheit: ja/nein
        typ: bool
        wert: true
        status: Annahme
        quelle: Rollenmodell STIHL liefert Box, Partner fliegt
        kommentar: nein = Eigenbetrieb, alle Kosten werden einzeln kalkuliert
      - key: modell.autonom
        label: Autonomer Flugbetrieb (hypothetisch)
        einheit: ja/nein
        typ: bool
        wert: false
        status: Annahme
        quelle: Zukunftsszenario, technische und rechtliche Zulässigkeit offen
        kommentar: Nur im Eigenbetrieb wirksam. Pilot entfällt, Überwachung und Bodenpersonal bleiben

  - id: anreise
    titel: Anreise
    beschreibung: Standardwerte für die Anreise. Anbieter können eigene Preise in der Anbieterliste haben.
    parameter:
      - key: anreise.pauschale_eur
        label: Anfahrtspauschale je Anreise
        einheit: €
        wert: 80
        min: 0
        max: 2000
        step: 5
        status: Annahme
        quelle: Platzhalter bis Angebote vorliegen
      - key: anreise.eur_km
        label: Fahrzeugkosten je km
        einheit: €/km
        wert: 1.20
        min: 0
        max: 10
        step: 0.05
        status: Annahme
        quelle: Transporter mit Equipment, Platzhalter
        kommentar: Gilt für Hin- und Rückweg
      - key: anreise.zuschlag_min
        label: Zuschlag letzte Meile je Richtung
        einheit: min
        wert: 15
        min: 0
        max: 120
        step: 5
        status: Annahme
        quelle: Forststraße oder Feldweg bis zum Landeplatz, im Routing nicht enthalten
      - key: anreise.umwegfaktor
        label: Umwegfaktor (nur ohne Routing)
        einheit: ×
        wert: 1.4
        min: 1
        max: 3
        step: 0.05
        status: Annahme
        quelle: Ersatzrechnung Luftlinie → Straße im Bergland
      - key: anreise.v_kmh
        label: Ø Geschwindigkeit (nur ohne Routing)
        einheit: km/h
        wert: 50
        min: 10
        max: 120
        step: 5
        status: Annahme
        quelle: Ersatzrechnung im Bergland

  - id: personal
    titel: Personal Drohneneinsatz
    beschreibung: Crew des Drohneneinsatzes im Eigenbetrieb. Pilot kann auf 0 €/h gesetzt werden.
    parameter:
      - key: personal.pilot_eur_h
        label: Stundensatz Pilot
        einheit: €/h
        wert: 35
        min: 0
        max: 300
        step: 1
        status: Annahme
        quelle: Beispielwert aus dem Projektdokument
      - key: personal.helfer_n
        label: Helfer zusätzlich zum Pilot
        einheit: Personen
        typ: int
        wert: 1
        min: 0
        max: 10
        step: 1
        status: Annahme
        quelle: Einweiser am Lastaufnahmepunkt
      - key: personal.helfer_eur_h
        label: Stundensatz Helfer
        einheit: €/h
        wert: 30
        min: 0
        max: 300
        step: 1
        status: Annahme
        quelle: Platzhalter

  - id: einsatz
    titel: Aufbau und Abbau
    beschreibung: Zeiten vor Ort je Einsatztag (Drohne entladen, prüfen, Route einrichten, sichern, verladen).
    parameter:
      - key: einsatz.aufbau_min
        label: Aufbau und Inbetriebnahme
        einheit: min
        wert: 45
        min: 0
        max: 300
        step: 5
        status: Annahme
        quelle: Schätzung, mit Dienstleister validieren
      - key: einsatz.abbau_min
        label: Abbau
        einheit: min
        wert: 30
        min: 0
        max: 300
        step: 5
        status: Annahme
        quelle: Schätzung, mit Dienstleister validieren

  - id: dienstleister
    titel: Dienstleister-Abrechnung
    beschreibung: Gilt, wenn über einen Dienstleister abgerechnet wird. Anbieter können eigene Sätze haben.
    parameter:
      - key: dl.einsatz_eur_h
        label: Stundensatz Einsatz (Team inkl. Drohne)
        einheit: €/h
        wert: 180
        min: 0
        max: 2000
        step: 5
        status: Annahme
        quelle: Platzhalter bis Angebote vorliegen
        kommentar: Pilot ist enthalten, wird nicht zusätzlich berechnet
      - key: dl.fahrt_eur_h
        label: Stundensatz Fahrzeit je Person
        einheit: €/h
        wert: 35
        min: 0
        max: 300
        step: 1
        status: Annahme
        quelle: Platzhalter bis Angebote vorliegen
      - key: dl.flug_eur
        label: Zuschlag je Flug
        einheit: €
        wert: 0
        min: 0
        max: 1000
        step: 5
        status: Annahme
        quelle: Optional, falls Anbieter je Flug abrechnet
      - key: dl.betrieb_inkl
        label: Drohnenbetrieb im Stundensatz enthalten
        einheit: ja/nein
        typ: bool
        wert: true
        status: Annahme
        quelle: Üblich bei Komplettangeboten
        kommentar: nein = Betriebskosten werden zusätzlich berechnet
      - key: dl.aufbau_abgerechnet
        label: Aufbau und Abbau als Einsatzzeit abgerechnet
        einheit: ja/nein
        typ: bool
        wert: true
        status: Annahme
        quelle: Angebot prüfen

  - id: betrieb
    titel: Drohnenbetrieb
    beschreibung: Betriebskosten der Drohne im Eigenbetrieb (oder beim Dienstleister, wenn nicht enthalten).
    parameter:
      - key: betrieb.abschreibung_eur_tag
        label: Abschreibung oder Miete je Einsatztag
        einheit: €/Tag
        wert: 150
        min: 0
        max: 5000
        step: 10
        status: Annahme
        quelle: Platzhalter, aus Anschaffungspreis und Einsatztagen pro Jahr ableiten
      - key: betrieb.versicherung_eur_tag
        label: Versicherung je Einsatztag
        einheit: €/Tag
        wert: 20
        min: 0
        max: 1000
        step: 5
        status: Annahme
        quelle: Platzhalter
      - key: betrieb.wartung_eur_fh
        label: Wartung und Verschleiß je Flugstunde
        einheit: €/Fh
        wert: 40
        min: 0
        max: 1000
        step: 5
        status: Annahme
        quelle: Platzhalter
      - key: betrieb.akku_eur_fh
        label: Akkualterung je Flugstunde
        einheit: €/Fh
        wert: 30
        min: 0
        max: 1000
        step: 5
        status: Annahme
        quelle: Platzhalter, aus Akkupreis und Ladezyklen ableiten
      - key: betrieb.strom_eur_kwh
        label: Strompreis
        einheit: €/kWh
        wert: 0.30
        min: 0
        max: 2
        step: 0.01
        status: Annahme
        quelle: Platzhalter
      - key: drohne.energie_kwh_flug
        label: Energie je Flug
        einheit: kWh
        wert: 2.0
        min: 0
        max: 50
        step: 0.1
        status: Annahme
        quelle: Grobe Schätzung, wird in Phase 4 durch Energiemodell ersetzt
      - key: autonom.ueberwachung_eur_h
        label: Fernüberwachung je Flugstunde (autonom)
        einheit: €/Fh
        wert: 25
        min: 0
        max: 500
        step: 5
        status: Annahme
        quelle: Hypothetisch
      - key: autonom.bodenpersonal_n
        label: Bodenpersonal (autonom)
        einheit: Personen
        typ: int
        wert: 1
        min: 0
        max: 10
        step: 1
        status: Annahme
        quelle: Start- und Landeabwicklung, Sicherheitsaufsicht
        kommentar: Abrechnung zum Stundensatz Helfer
      - key: betrieb.sonstiges_eur
        label: Sonstige Kosten je Einsatztag
        einheit: €
        wert: 0
        min: 0
        max: 5000
        step: 10
        status: Annahme
        quelle: z. B. Genehmigungsgebühren anteilig

  - id: heu
    titel: Heuernte
    beschreibung: Ertrag und Flächenleistungen für den Use Case Heuernte. Werte mit Bergbauern validieren.
    parameter:
      - key: heu.ertrag_kg_ha
        label: Heuertrag
        einheit: kg/ha
        wert: 2000
        min: 100
        max: 15000
        step: 100
        status: Annahme
        quelle: Beispielwert aus dem Projektdokument, Ertrag in Steillagen erheben
      - key: heu.trocknung_tage
        label: Trocknungsdauer
        einheit: Tage
        typ: int
        wert: 1
        min: 0
        max: 7
        step: 1
        status: Annahme
        quelle: Wetterabhängig
      - key: heu.maehleistung_ha_h
        label: Mähleistung Freischneider je Person
        einheit: ha/h
        wert: 0.08
        min: 0.01
        max: 1
        step: 0.01
        status: Annahme
        quelle: Schätzung für steile Bergwiese, mit Feldtest validieren
      - key: heu.blasleistung_ha_h
        label: Zusammenblasen je Person
        einheit: ha/h
        wert: 0.2
        min: 0.01
        max: 2
        step: 0.01
        status: Annahme
        quelle: Schätzung, mit Feldtest validieren
      - key: heu.dichte_kg_m3
        label: Heudichte im Sack
        einheit: kg/m³
        wert: 70
        min: 10
        max: 300
        step: 5
        status: Annahme
        quelle: Lose eingeblasenes Heu, durch Versuch mit dem Sack ermitteln
        kommentar: Bestimmt zusammen mit dem Sackvolumen die Last je Flug
      - key: manuell.traglast_heu_kg
        label: Heu je Person und Gang (Tragen)
        einheit: kg
        wert: 30
        min: 5
        max: 80
        step: 1
        status: Annahme
        quelle: Heutuch oder Netz auf dem Rücken, mit Bergbauern validieren

  - id: sack
    titel: Heusammelsack
    beschreibung: Neues Produktkonzept. Aufspannbarer Sack zum Einblasen, Verschließen und Fliegen.
    parameter:
      - key: sack.volumen_m3
        label: Nutzbares Volumen
        einheit: m³
        wert: 1.0
        min: 0.1
        max: 10
        step: 0.1
        status: Annahme
        quelle: Konzept, Prototyp ausstehend
      - key: sack.leergewicht_kg
        label: Leergewicht inkl. Gestell
        einheit: kg
        wert: 6
        min: 0
        max: 50
        step: 0.5
        status: Annahme
        quelle: Konzept, Prototyp ausstehend
      - key: sack.anzahl
        label: Säcke im Umlauf
        einheit: Stück
        typ: int
        wert: 6
        min: 1
        max: 50
        step: 1
        status: Annahme
        quelle: Beispielwert aus dem Projektdokument
        kommentar: Ab zwei Flugladungen arbeiten Team und Drohne parallel
      - key: sack.befuellzeit_min
        label: Befüllen und Verschließen je Sack
        einheit: min
        wert: 8
        min: 1
        max: 60
        step: 1
        status: Annahme
        quelle: Schätzung, Luftströmung und Verdichtung im Versuch klären

  - id: heli
    titel: Helikopter
    beschreibung: Vergleichsverfahren Außenlastflug mit Helikopter.
    parameter:
      - key: heli.eur_min
        label: Preis je Flugminute
        einheit: €/min
        wert: 30
        min: 0
        max: 200
        step: 1
        status: Annahme
        quelle: Teamdiskussion, Bandbreite 25 bis 35 €/min, nicht validiert
      - key: heli.nutzlast_kg
        label: Nutzlast je Rotation
        einheit: kg
        wert: 750
        min: 100
        max: 3000
        step: 50
        status: Annahme
        quelle: Teamdiskussion, Bandbreite 750 bis 1.200 kg, nicht validiert
      - key: heli.v_kmh
        label: Transfergeschwindigkeit Basis → Einsatzort
        einheit: km/h
        wert: 180
        min: 50
        max: 300
        step: 10
        status: Annahme
        quelle: Größenordnung einmotoriger Arbeitshubschrauber, Typ offen
        kommentar: Anflug wird aus der Luftlinie zur Basis berechnet
      - key: heli.mindest_min
        label: Mindestabrechnung je Einsatz
        einheit: min
        wert: 30
        min: 0
        max: 300
        step: 5
        status: Annahme
        quelle: Platzhalter, beim Anbieter erfragen
      - key: heli.bereitstellung_eur
        label: Bereitstellung je Einsatz
        einheit: €
        wert: 0
        min: 0
        max: 5000
        step: 10
        status: Annahme
        quelle: Platzhalter, beim Anbieter erfragen
      - key: heli.rotation_min
        label: Dauer je Rotation
        einheit: min
        wert: 6
        min: 1
        max: 60
        step: 1
        status: Annahme
        quelle: Schätzung inkl. Ein- und Aushängen
      - key: heli.kerosin_l_h
        label: Kerosinverbrauch
        einheit: l/h
        wert: 170
        min: 0
        max: 1000
        step: 10
        status: Annahme
        quelle: Größenordnung einmotoriger Arbeitshubschrauber, Typ offen

  - id: manuell
    titel: Manueller Transport
    beschreibung: Tragen durch das Team als Vergleichsverfahren.
    parameter:
      - key: manuell.traglast_kg
        label: Traglast je Person
        einheit: kg
        wert: 20
        min: 5
        max: 50
        step: 1
        status: Annahme
        quelle: Planungswert für steiles Gelände, ergonomisch prüfen
      - key: manuell.v_horizontal_kmh
        label: Gehgeschwindigkeit horizontal
        einheit: km/h
        wert: 4
        min: 1
        max: 8
        step: 0.5
        status: Literaturwert
        quelle: DIN 33466 Wanderzeitberechnung (4 km/h)
      - key: manuell.aufstieg_hm_h
        label: Aufstieg
        einheit: Hm/h
        wert: 300
        min: 50
        max: 1000
        step: 10
        status: Literaturwert
        quelle: DIN 33466 Wanderzeitberechnung (300 Hm/h)
      - key: manuell.abstieg_hm_h
        label: Abstieg
        einheit: Hm/h
        wert: 500
        min: 50
        max: 2000
        step: 10
        status: Literaturwert
        quelle: DIN 33466 Wanderzeitberechnung (500 Hm/h)
      - key: manuell.lastfaktor
        label: Zeitaufschlag beim Tragen mit Last
        einheit: ×
        wert: 1.3
        min: 1
        max: 3
        step: 0.05
        status: Annahme
        quelle: DIN-Werte gelten ohne schwere Last; Aufschlag mit Felddaten Montafon validieren
        kommentar: Gilt nur für den Weg mit Last
      - key: manuell.stundensatz_eur_h
