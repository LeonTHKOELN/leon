# ---------------------------------------------------------------------------
# Szenarien = benannte Abweichungen von den Basiswerten in parameter.yaml.
# Nicht aufgeführte Parameter behalten ihren Basiswert.
#
# Lesart:  konservativ = ungünstige Annahmen für die Drohne
#          optimistisch = günstige Annahmen für die Drohne
# Alle Werte sind Szenarioannahmen, keine Prognosen.
# ---------------------------------------------------------------------------

szenarien:

  - id: basis
    name: Basis
    beschreibung: Basiswerte aus parameter.yaml
    werte: {}

  - id: konservativ
    name: Konservativ
    beschreibung: Geringere Drohnenleistung, höhere Drohnenkosten, günstiger Helikopter
    werte:
      drohne.nutzlast_kg: 65
      drohne.v_reise_ms: 8
      drohne.steigrate_ms: 2.5
      flug.handling_min: 8
      dl.einsatz_eur_h: 240
      einsatz.aufbau_min: 60
      heli.eur_min: 25
      heli.nutzlast_kg: 1200

  - id: optimistisch
    name: Optimistisch
    beschreibung: Höhere Drohnenleistung, geringere Drohnenkosten, teurer Helikopter
    werte:
      drohne.nutzlast_kg: 100
      drohne.v_reise_ms: 12
      drohne.steigrate_ms: 4
      flug.handling_min: 4
      dl.einsatz_eur_h: 140
      einsatz.aufbau_min: 30
      heli.eur_min: 35
      heli.nutzlast_kg: 750

  - id: autonom_2035
    name: 2035 autonom (hypothetisch)
    beschreibung: Eigenbetrieb ohne Pilot, höhere Nutzlast. Szenarioannahme, keine Prognose
    werte:
      modell.dienstleister: false
      modell.autonom: true
      drohne.nutzlast_kg: 150
      drohne.v_reise_ms: 14
      flug.handling_min: 3
      einsatz.aufbau_min: 20
      einsatz.abbau_min: 15
